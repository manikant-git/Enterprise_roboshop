gzip on;

gzip_comp_level 6;

gzip_min_length 1024;

gzip_vary on;

gzip_proxied any;

gzip_buffers 16 8k;

gzip_http_version 1.1;

gzip_types
text/plain
text/css
text/javascript
application/javascript
application/json
application/xml
application/xml+rss
application/rss+xml
application/xhtml+xml
application/x-font-ttf
application/vnd.ms-fontobject
font/opentype
image/svg+xml;
